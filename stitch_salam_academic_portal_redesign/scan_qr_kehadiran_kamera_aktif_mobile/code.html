<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR Kehadiran - SALAM UIN SGD Bandung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#3F7A1F',
              hover: '#2F6016',
              tint: '#E6F0DC',
              leaf: '#8CC43F',
            },
            ink: {
              DEFAULT: '#263235',
              muted: '#55626A',
            },
            surface: {
              bg: '#F3F5F2',
              card: '#FFFFFF',
              border: '#DCE2DA',
            },
            state: {
              success: '#1F7A4D',
              'success-tint': '#E1F2E9',
              warning: '#A85F00',
              'warning-tint': '#FDF0DA',
              danger: '#B3261E',
              'danger-tint': '#FBE4E2',
              info: '#1F5F8B',
              'info-tint': '#E0EEF7',
            }
          },
          fontFamily: {
            sans: ['Public Sans', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: #0F1416;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }
    .viewfinder-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #8CC43F;
      border-width: 4px;
    }
    .scanner-line {
      animation: scan 2.4s ease-in-out infinite alternate;
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(216px); opacity: 0.2; }
    }
  </style>
</head>
<body class="bg-[#0F1416] text-white flex flex-col justify-between min-h-screen max-w-[390px] mx-auto relative overflow-hidden select-none">

  <!-- Status Bar Simulation -->
  <header class="w-full pt-3 px-6 flex justify-between items-center text-xs text-white/70 tracking-tight z-20">
    <span class="font-medium">09:41</span>
    <div class="flex items-center space-x-2">
      <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.98 10.57 20.5 12 20.5c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15.5c-3.58 0-6.5-2.92-6.5-6.5S8.42 5.5 12 5.5s6.5 2.92 6.5 6.5-2.92 6.5-6.5 6.5z"></path></svg>
      <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
      <div class="w-5 h-2.5 border border-white/60 rounded-sm p-0.5 flex items-center">
        <div class="w-full h-full bg-white/90 rounded-2xs"></div>
      </div>
    </div>
  </header>

  <!-- Camera Top Bar -->
  <div class="w-full px-5 py-3 flex items-center justify-between z-20 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
    <button class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 active:bg-white/30 flex items-center justify-center transition-colors text-white" aria-label="Tutup kamera">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    <div class="text-center flex-1 px-3">
      <h1 class="text-base font-semibold text-white tracking-tight">Scan QR kehadiran</h1>
      <p class="text-xs text-white/80 font-normal truncate">Interaksi Manusia dan Komputer</p>
    </div>
    <div class="w-10 flex items-center justify-end">
      <!-- Flashlight / Info button -->
      <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white/80 hover:text-white" title="Senter">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Camera Viewfinder Section -->
  <main class="flex-1 flex flex-col items-center justify-center relative px-6 z-10 my-auto">
    <!-- Camera background texture simulation -->
    <div class="absolute inset-0 bg-[#141b17] flex items-center justify-center overflow-hidden opacity-60">
      <div class="w-full h-full opacity-20 bg-[radial-gradient(#8CC43F_1px,transparent_1px)] [background-size:16px_16px]"></div>
    </div>

    <!-- Square Viewfinder Frame (240x240) -->
    <div class="relative w-[240px] h-[240px] rounded-[14px] bg-black/35 shadow-[0_0_0_9999px_rgba(0,0,0,0.58)] flex items-center justify-center overflow-hidden border border-white/10">
      <!-- 4 Corner Marks in Leaf Green -->
      <div class="viewfinder-corner top-0 left-0 rounded-tl-[10px] border-r-0 border-b-0"></div>
      <div class="viewfinder-corner top-0 right-0 rounded-tr-[10px] border-l-0 border-b-0"></div>
      <div class="viewfinder-corner bottom-0 left-0 rounded-bl-[10px] border-r-0 border-t-0"></div>
      <div class="viewfinder-corner bottom-0 right-0 rounded-br-[10px] border-l-0 border-t-0"></div>

      <!-- Laser Scanner Line -->
      <div class="scanner-line absolute top-2 left-3 right-3 h-[2px] bg-gradient-to-r from-transparent via-[#8CC43F] to-transparent shadow-[0_0_8px_#8CC43F]"></div>

      <!-- Center guide crosshair subtle -->
      <div class="w-8 h-8 border border-white/20 rounded-md pointer-events-none flex items-center justify-center">
        <div class="w-1 h-1 bg-white/40 rounded-full"></div>
      </div>
    </div>

    <!-- Hint Text under Frame -->
    <div class="mt-6 text-center max-w-[260px] z-20">
      <p class="text-sm text-white/90 font-medium">Arahkan kamera ke QR dari dosen</p>
      <p class="text-xs text-white/60 mt-1">Pastikan kode QR berada di dalam bingkai hijau</p>
    </div>
  </main>

  <!-- Bottom Action Card Sheet -->
  <footer class="w-full p-5 bg-gradient-to-t from-black via-black/90 to-transparent z-20 flex flex-col space-y-3">
    <!-- Prominent Secondary: Masukkan kode manual -->
    <button class="w-full h-12 bg-white/15 hover:bg-white/20 active:bg-white/25 text-white font-semibold text-[15px] rounded-[8px] border border-white/30 flex items-center justify-center space-x-2 transition-colors">
      <svg class="w-4 h-4 text-[#8CC43F]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
      </svg>
      <span>Masukkan kode manual</span>
    </button>

    <!-- Secondary button: Batal -->
    <button class="w-full h-11 bg-transparent hover:bg-white/5 active:bg-white/10 text-white/80 font-medium text-[14px] rounded-[8px] transition-colors">
      Batal
    </button>

    <!-- Tertiary link: Tidak bisa scan? Laporkan masalah -->
    <div class="text-center pt-1 pb-1">
      <a href="#" class="text-xs text-white/70 hover:text-white underline underline-offset-4 transition-colors">
        Tidak bisa scan? Laporkan masalah
      </a>
    </div>

    <!-- Home Indicator line -->
    <div class="w-32 h-1 bg-white/30 rounded-full mx-auto mt-2"></div>
  </footer>



</body></html>
